[project]
name = "github-issue-mcp"
version = "1.0.0"
description = "A secure local MCP server for searching and creating GitHub issues"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]==2.2.0",
    "python-dotenv==1.1.1",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
