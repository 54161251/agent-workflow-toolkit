name: Project tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  github-issue-mcp:
    name: GitHub Issue MCP
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: github-issue-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
  draft-approval-review-queue:
    name: Draft Approval Review Queue (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: draft-approval-review-queue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python demo.py
